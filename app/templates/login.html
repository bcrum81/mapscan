<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — MAP Scan</title><link rel="stylesheet" href="/static/app.css?v={{ asset_v }}">
</head><body class="centered">
<main class="auth">
  <h1>MAP Scan</h1>
  <p class="meta">{{ brand_name }} — MAP compliance</p>
  {% if error %}<p class="alert bad">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Email
      <input type="email" name="email" autocomplete="username" required autofocus></label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
  </form>
  <p class="meta small">
    No account? An administrator has to invite you. Lost your password? Ask an
    administrator to send a reset link.
  </p>
</main>
</body></html>
